name: Deploy Pages

# Publishes the generated docs/ site (the Kodi repository) to GitHub Pages via
# the GitHub Actions deployment path. This replaces the legacy branch/docs
# "pages-build-deployment" pipeline, whose managed deploy step wedged and timed
# out after ~10 min on every push (site frozen 2026-08-06). Here the deploy is
# actions/deploy-pages, which we control and can see the logs of.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
